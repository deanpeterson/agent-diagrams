<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>One API, from a form to audited traffic</title>
<style>
  :root{color-scheme:dark;--bg:#0a0f1e;--ink:#e8eefc;--muted:#9fb0d0;--line:#26344f;--gold:#fbbf24;--cyan:#22d3ee;--green:#34d399;--violet:#a78bfa;--rose:#fb7185;--blue:#60a5fa}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Red Hat Text",Inter,"Segoe UI",sans-serif;width:1728px;height:1117px;overflow:hidden}
  .card{position:absolute;inset:0;background:radial-gradient(1400px 700px at 30% -10%,#15203d 0%,#0a0f1e 60%)}
  svg{position:absolute;inset:0;width:1728px;height:1117px}
  .t{font-weight:700;font-size:30px;fill:var(--ink)}
  .s{font-size:19px;fill:var(--muted)}
  .nt{font-weight:700;font-size:22px;fill:var(--ink)}
  .ns{font-size:16px;fill:var(--muted)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;fill:#bfeaf5}
  .band{font-size:15px;font-weight:700;letter-spacing:1.5px;fill:var(--muted)}
  .node{stroke-width:2}
  .n-std{fill:#121a2e;stroke:#3b4a6b}.n-gold{fill:#161a2c;stroke:rgba(251,191,36,.7)}.n-cyan{fill:#0e1e34;stroke:rgba(34,211,238,.7)}
  .n-blue{fill:#0f1b34;stroke:rgba(96,165,250,.8)}.n-violet{fill:#151332;stroke:rgba(167,139,250,.7)}.n-green{fill:#0d2321;stroke:rgba(52,211,153,.7)}
  .zone{fill:rgba(96,165,250,.04);stroke:rgba(96,165,250,.4);stroke-dasharray:8 9;stroke-width:2}
  .wire{fill:none;stroke-width:2.5}
  .w-cfg{stroke:rgba(203,213,225,.35);stroke-dasharray:3 9}.w-req{stroke:rgba(251,191,36,.5)}.w-key{stroke:rgba(167,139,250,.6)}.w-sig{stroke:rgba(34,211,238,.55)}
  .g{opacity:0}
</style>
<style>
  html,body{width:100%!important;height:100%!important;background:#0a0f1e}
  #stage{position:fixed;left:50%;top:50%;width:1728px;height:1117px;transform-origin:center center}
  #stage .card, #stage svg{position:absolute}
  #pbar{position:fixed;left:0;bottom:0;height:4px;background:#fbbf24;width:0;z-index:5;opacity:.9}
  #pctl{position:fixed;right:14px;bottom:14px;z-index:6;display:flex;gap:8px;font:13px -apple-system,"Red Hat Text",Inter,sans-serif}
  #pctl button{background:#121a2e;color:#e8eefc;border:1px solid #3b4a6b;border-radius:8px;padding:6px 12px;cursor:pointer}
  #pctl button:hover{border-color:#fbbf24}
</style>
</head>
<body><div id="stage"><div class="card"></div>
<svg viewBox="0 0 1728 1117" xmlns="http://www.w3.org/2000/svg">
<defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<text x="60" y="78" class="t">One API, from a form to audited traffic</text>
<text x="60" y="112" class="s">What the platform does by itself once the developer clicks Create</text>

<!-- developer + form -->
<g id="dev" class="g">
  <rect x="60" y="300" width="250" height="150" rx="16" class="node n-gold"/>
  <text x="185" y="345" text-anchor="middle" class="nt">Developer</text>
  <text x="185" y="378" text-anchor="middle" class="ns">one form in</text>
  <text x="185" y="402" text-anchor="middle" class="ns">Red Hat Developer Hub</text>
  <text x="185" y="432" text-anchor="middle" class="mono">name · owner · contract · plans</text>
</g>
<!-- repo -->
<g id="repo" class="g">
  <rect x="400" y="260" width="300" height="230" rx="16" class="node n-std"/>
  <text x="550" y="298" text-anchor="middle" class="nt">Git repository</text>
  <text x="550" y="322" text-anchor="middle" class="ns">price-check-api-gitops</text>
  <g class="mono" id="files">
    <text x="430" y="356" class="mono">openapi.yaml</text>
    <text x="430" y="380" class="mono">gitops/namespace.yaml</text>
    <text x="430" y="404" class="mono">gitops/backend.yaml · httproute.yaml</text>
    <text x="430" y="428" class="mono">gitops/authpolicy.yaml · planpolicy.yaml</text>
    <text x="430" y="452" class="mono">gitops/apiproduct.yaml · dashboard.yaml</text>
    <text x="430" y="476" class="mono">catalog-info.yaml</text>
  </g>
</g>
<!-- gitops -->
<g id="gitops" class="g">
  <rect x="790" y="320" width="230" height="110" rx="16" class="node n-blue"/>
  <text x="905" y="365" text-anchor="middle" class="nt">OpenShift GitOps</text>
  <text x="905" y="395" text-anchor="middle" class="ns">syncs the repository</text>
</g>
<!-- cluster zone -->
<g id="zone" class="g">
  <rect x="1100" y="180" width="570" height="560" rx="22" class="zone"/>
  <text x="1120" y="212" class="band">NAMESPACE api-price-check</text>
</g>
<g id="n1" class="g"><rect x="1130" y="240" width="240" height="70" rx="12" class="node n-std"/><text x="1250" y="283" text-anchor="middle" class="nt">backend</text></g>
<g id="n2" class="g"><rect x="1400" y="240" width="250" height="70" rx="12" class="node n-cyan"/><text x="1525" y="272" text-anchor="middle" class="nt">HTTPRoute</text><text x="1525" y="296" text-anchor="middle" class="ns">on the shared gateway</text></g>
<g id="n3" class="g"><rect x="1130" y="340" width="240" height="70" rx="12" class="node n-violet"/><text x="1250" y="372" text-anchor="middle" class="nt">AuthPolicy</text><text x="1250" y="396" text-anchor="middle" class="ns">keys through the catalog</text></g>
<g id="n4" class="g"><rect x="1400" y="340" width="250" height="70" rx="12" class="node n-violet"/><text x="1525" y="372" text-anchor="middle" class="nt">PlanPolicy</text><text x="1525" y="396" text-anchor="middle" class="ns">gold · silver · bronze</text></g>
<g id="n5" class="g"><rect x="1130" y="440" width="240" height="70" rx="12" class="node n-gold"/><text x="1250" y="472" text-anchor="middle" class="nt">API product</text><text x="1250" y="496" text-anchor="middle" class="ns">request a key here</text></g>
<g id="n6" class="g"><rect x="1400" y="440" width="250" height="70" rx="12" class="node n-green"/><text x="1525" y="472" text-anchor="middle" class="nt">Dashboard</text><text x="1525" y="496" text-anchor="middle" class="ns">Perses, as code</text></g>
<g id="n7" class="g"><rect x="1130" y="540" width="520" height="60" rx="12" class="node n-std"/><text x="1390" y="577" text-anchor="middle" class="ns">quota · tracing agent injection · catalog entry (Component + API)</text></g>
<!-- consumer -->
<g id="consumer" class="g">
  <rect x="60" y="640" width="250" height="110" rx="16" class="node n-violet"/>
  <text x="185" y="685" text-anchor="middle" class="nt">Consumer</text>
  <text x="185" y="715" text-anchor="middle" class="ns">requests a key, owner approves</text>
</g>
<!-- three records -->
<g id="rec" class="g">
  <text x="60" y="860" class="band">EVERY CALL LEAVES THREE RECORDS</text>
  <g id="r1"><rect x="60" y="885" width="330" height="90" rx="14" class="node n-green"/><text x="225" y="922" text-anchor="middle" class="nt">a metric</text><text x="225" y="950" text-anchor="middle" class="ns">the owner's dashboard</text></g>
  <g id="r2"><rect x="420" y="885" width="330" height="90" rx="14" class="node n-cyan"/><text x="585" y="922" text-anchor="middle" class="nt">a log line with the caller</text><text x="585" y="950" text-anchor="middle" class="ns">user, plan, response, request id</text></g>
  <g id="r3"><rect x="780" y="885" width="330" height="90" rx="14" class="node n-gold"/><text x="945" y="922" text-anchor="middle" class="nt">a trace</text><text x="945" y="950" text-anchor="middle" class="ns">every hop of one request</text></g>
</g>
<!-- wires -->
<path id="w1" class="wire w-cfg" d="M310 375 L400 375"/>
<path id="w2" class="wire w-cfg" d="M700 375 L790 375"/>
<path id="w3" class="wire w-cfg" d="M1020 375 L1100 375"/>
<path id="w4" class="wire w-key" d="M310 695 C 700 695, 900 480, 1130 475"/>
<g id="dots"></g>
</svg>
</div><script>
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fade=(id,t0,d=0.5)=>{const e=$(id); e.style.opacity=clamp((T-t0)/d,0,1);};
// beats (seconds) matched to the narration
const B={dev:0.6, repo:3.2, gitops:5.6, zone:7.2, n1:7.8, n2:8.5, n3:9.3, n4:9.9, n5:10.6, n6:11.3, n7:12.2, consumer:13.6, rec:16.2, r1:16.6, r2:17.4, r3:18.3};
let T=0;
const dotsG=$('dots');
function dot(pathId,t0,t1,color,r=7){ if(T<t0||T>t1) return; const p=$(pathId); const L=p.getTotalLength(); const q=p.getPointAtLength(L*(T-t0)/(t1-t0)); const c=document.createElementNS('http://www.w3.org/2000/svg','circle'); c.setAttribute('cx',q.x); c.setAttribute('cy',q.y); c.setAttribute('r',r); c.setAttribute('fill',color); c.setAttribute('filter','url(#glow)'); dotsG.appendChild(c); }
const SCALE=Number(new URLSearchParams(location.search).get('scale')||1);
window.seek=function(t){ T=t/SCALE; dotsG.innerHTML='';
  for(const k in B) fade(k,B[k]);
  ['w1','w2','w3','w4'].forEach((w,i)=>{ $(w).style.opacity = T>[B.repo-0.4,B.gitops-0.4,B.zone-0.4,B.consumer+0.4][i] ? 1 : 0.12; });
  dot('w1',B.dev+1.2,B.repo,'#fbbf24'); dot('w2',B.repo+1.4,B.gitops,'#cbd5e1'); dot('w3',B.gitops+0.8,B.zone+0.2,'#60a5fa');
  for(let i=0;i<4;i++) dot('w4',B.consumer+0.6+i*0.5,B.consumer+2.4+i*0.5,'#a78bfa',6);
  // records pulse
  ['r1','r2','r3'].forEach((r,i)=>{ const t0=B[r]; const e=$(r); e.style.filter = (T>t0 && ((T-t0)%1.4)<0.35) ? 'url(#glow)' : 'none'; });
};
seek(0);
</script>
<div id="pbar"></div>
<div id="pctl"><button id="pp" title="space">Pause</button><button id="rs" title="R">Restart</button></div>
<script>
(function(){
  // fit the fixed 1728x1117 stage to the window
  const stage=document.getElementById('stage');
  function fit(){ const s=Math.min(innerWidth/1728, innerHeight/1117); stage.style.transform='translate(-50%,-50%) scale('+s+')'; }
  addEventListener('resize',fit); fit();
  const D=20.5, HOLD=5.0, SPEED=0.8, TOTAL=D+HOLD;
  const hash=new URLSearchParams(location.hash.replace(/^#/,''));
  if(hash.has('t')){ window.seek(Number(hash.get('t'))); document.getElementById('pctl').style.display='none'; return; }
  if(navigator.webdriver){ return; }   // frame capture drives seek() itself
  let t=0, last=performance.now(), playing=true;
  const bar=document.getElementById('pbar'), pp=document.getElementById('pp');
  function frame(now){ const dt=(now-last)/1000; last=now; if(playing){ t+=dt*SPEED; if(t>TOTAL) t=0; }
    window.seek(Math.min(t,D)); bar.style.width=(100*Math.min(t,D)/D)+'%'; requestAnimationFrame(frame); }
  function toggle(){ playing=!playing; pp.textContent=playing?'Pause':'Play'; }
  pp.onclick=toggle; document.getElementById('rs').onclick=()=>{ t=0; if(!playing) toggle(); };
  addEventListener('keydown',e=>{ if(e.key===' '){ e.preventDefault(); toggle(); } else if(e.key==='r'||e.key==='R'){ t=0; } else if(e.key==='ArrowRight'){ t=Math.min(D,t+1); } else if(e.key==='ArrowLeft'){ t=Math.max(0,t-1); } });
  requestAnimationFrame(frame);
})();
</script>
</body></html>
